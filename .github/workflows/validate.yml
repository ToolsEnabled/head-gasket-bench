# Validate submitted runs on pull requests; run every test suite on pushes to main.
# No secrets are used. The only actions are actions/checkout and actions/setup-python,
# pinned by commit SHA; nothing else is downloaded.
name: validate

on:
  pull_request:
    paths:
      - 'runs/submitted/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'
      - id: find
        name: List changed submissions and the CPython version each record names
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A submission pull request may add or change only runs/submitted/<name>/ and the
          # regenerated leaderboard/board.json. Anything else (tools, env, scorer) is a code
          # change and goes through a normal review, not through this check.
          outside=$(git diff --name-only "$BASE_SHA" HEAD | grep -v -e '^runs/submitted/' -e '^leaderboard/board\.json$' || true)
          if [ -n "$outside" ]; then
            echo "::error::A submission pull request may change only runs/submitted/<name>/ and leaderboard/board.json. Also changed:"
            echo "$outside"
            exit 1
          fi
          git diff --name-only "$BASE_SHA" HEAD -- runs/submitted > changed.txt
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          names = sorted({p.split('/')[2] for p in Path('changed.txt').read_text().split() if p.count('/') >= 3})
          rows = []
          for name in names:
              if not re.fullmatch(r'[a-z0-9][a-z0-9._-]{2,99}', name):
                  raise SystemExit(f'bad submission folder name: {name!r}')
              folder = Path('runs/submitted') / name
              if not folder.is_dir():
                  continue  # a removed submission has nothing to validate
              version = '3.12.3'
              try:
                  found = json.loads((folder / 'run.json').read_bytes())['environment_source']['interpreter']['version']
                  if isinstance(found, list) and len(found) == 3 and found[:2] == [3, 12] and all(type(v) is int for v in found):
                      version = '.'.join(map(str, found))
              except Exception:
                  pass  # the validator reports the problem
              rows.append({'name': name, 'python': version})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': rows}) + '\n')
              out.write('any=' + ('true' if rows else 'false') + '\n')
          PY

  submission:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed.outputs.matrix) }}
    steps:
      # The validator, environment and scorer come from the base branch, never from the
      # pull request; the pull request supplies only the submission folder (checked out
      # under pr/ and read as data).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate runs/submitted/${{ matrix.name }}
        env:
          SUBMISSION: ${{ matrix.name }}
        run: python3 -B tools/validate_submission.py "pr/runs/submitted/$SUBMISSION"

  board:
    needs: changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'
      - name: Leaderboard is up to date
        run: python3 -B tools/build_board.py --check

  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'   # the version the shipped records were made with; replay needs it
      - name: Environment tests
        working-directory: env
        run: python3 -B -m unittest discover -s tests
      - name: Environment pins
        working-directory: env
        run: python3 -B -m headgasket pins --check > /dev/null
      - name: Scorer tests
        working-directory: scorer
        run: python3 -B -m unittest discover -s tests
      - name: Validator and leaderboard tests
        run: python3 -B -m unittest discover -s tests
      - name: Leaderboard is up to date
        run: python3 -B tools/build_board.py --check
