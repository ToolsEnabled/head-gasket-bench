# Validate submitted runs on pull requests; run every test suite on pushes to main.
#
# The pull-request jobs run on pull_request_target, so GitHub takes this workflow file
# from the base branch: a pull request cannot change what its own check runs. Every
# script the jobs run (tools/check_pr_scope.py, tools/validate_submission.py, the
# environment, the scorer and tools/build_board.py) comes from the base branch's
# checkout. The pull request's commits are read with git, and its files are checked out
# under pr/ as data: nothing from the pull request is executed, imported or installed.
# The token is read-only, no secrets are used, and no checkout keeps credentials. The
# only actions are actions/checkout and actions/setup-python, pinned by commit SHA.
#
# The check runs on every pull request, with no paths filter: GitHub matches a paths
# filter against only the first 3,000 changed files, and a required check that a
# filter skips stays pending. The scope check itself decides whether a pull request is
# a submission (it changes runs/ or leaderboard/) or a code change. The verdict job
# sums up the others; it is the one check to require (MAINTAINING.md).
name: validate

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changed:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.find.outputs.kind }}
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'
      - id: find
        name: Check what merging the pull request would change; list its submissions and the CPython version each names
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A submission pull request may only add new folders runs/submitted/<name>/ and
          # change leaderboard/board.json. Anything else (tools, env, scorer, published
          # records, existing submissions) is a code change and goes through a normal review.
          # The check compares the base branch with the merge result (git merge-tree).
          git fetch --no-tags origin "$HEAD_SHA"
          python3 -B tools/check_pr_scope.py --base HEAD --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  submission:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed.outputs.matrix) }}
    steps:
      # The validator, environment and scorer come from the base branch; the pull request
      # supplies only the submission folder, read as data under pr/.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate runs/submitted/${{ matrix.name }}
        env:
          SUBMISSION: ${{ matrix.name }}
        run: python3 -B tools/validate_submission.py "pr/runs/submitted/$SUBMISSION"

  board:
    needs: changed
    if: github.event_name == 'pull_request_target' && needs.changed.outputs.kind == 'submission'
    runs-on: ubuntu-24.04
    steps:
      # The base branch's build_board.py rebuilds the board from the pull request's runs/
      # and compares it with the pull request's leaderboard/board.json.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'
      - name: Leaderboard is up to date
        run: python3 -B tools/build_board.py --runs pr/runs --out pr/leaderboard/board.json --check

  verdict:
    # A skipped job counts as passed in a required check, so require this job alone: it
    # fails unless the scope check passed and, for a submission pull request, the board
    # and every listed submission passed too.
    needs: [changed, submission, board]
    if: always() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - name: Every pull-request check passed
        env:
          CHANGED: ${{ needs.changed.result }}
          KIND: ${{ needs.changed.outputs.kind }}
          ANY: ${{ needs.changed.outputs.any }}
          SUBMISSION: ${{ needs.submission.result }}
          BOARD: ${{ needs.board.result }}
        run: |
          echo "scope: $CHANGED, kind: $KIND, submissions listed: $ANY, validator: $SUBMISSION, board: $BOARD"
          test "$CHANGED" = success
          test "$KIND" = code || test "$KIND" = submission
          test "$KIND" = code || test "$BOARD" = success
          test "$KIND" = code || test "$ANY" != true || test "$SUBMISSION" = success

  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12.3'   # the version the shipped records were made with; replay needs it
      - name: Environment tests
        working-directory: env
        run: python3 -B -m unittest discover -s tests
      - name: Environment pins
        working-directory: env
        run: python3 -B -m headgasket pins --check > /dev/null
      - name: Scorer tests
        working-directory: scorer
        run: python3 -B -m unittest discover -s tests
      - name: Validator and leaderboard tests
        run: python3 -B -m unittest discover -s tests
      - name: Leaderboard is up to date
        run: python3 -B tools/build_board.py --check
